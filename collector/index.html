<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Browser Fingerprinting Signal Collector</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <div
          style="
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 24px;
          "
        >
          <div>
            <h1>Browser Environment & Signal Collector</h1>
            <p class="subtitle" style="margin-bottom: 0">
              Controlled, consent-based client-side signal inspection.
            </p>
          </div>
          <a href="compatibility.html" class="btn" style="text-decoration: none"
            >Go to Usability Test</a
          >
        </div>

        <div class="controls-grid">
          <div class="input-group">
            <label>Config ID</label>
            <input
              type="text"
              id="config-id"
              class="meta-input"
              placeholder="e.g., firefox-strict"
            />
          </div>
          <div class="input-group">
            <label>Browser</label>
            <input
              type="text"
              id="browser-name"
              class="meta-input"
              placeholder="e.g., Firefox"
            />
          </div>
          <div class="input-group">
            <label>Version</label>
            <input
              type="text"
              id="browser-version"
              class="meta-input"
              placeholder="e.g., 120.0"
            />
          </div>
          <div class="input-group">
            <label>OS</label>
            <input
              type="text"
              id="os-name"
              class="meta-input"
              placeholder="e.g., Windows 11"
            />
          </div>
          <div class="input-group">
            <label>Mode</label>
            <input
              type="text"
              id="privacy-mode"
              class="meta-input"
              placeholder="e.g., Strict Tracking"
            />
          </div>
          <div class="input-group">
            <label>Run #</label>
            <input
              type="text"
              id="run-number"
              class="meta-input"
              placeholder="e.g., 01"
            />
          </div>
        </div>

        <div
          class="action-buttons"
          style="margin-bottom: 30px; display: flex; gap: 12px"
        >
          <button id="run-btn" class="btn primary" disabled>
            Run Collection
          </button>
          <button id="download-btn" class="btn" disabled>
            Download Profile JSON
          </button>
        </div>
      </header>

      <section class="table-card">
        <table id="signals-table">
          <thead>
            <tr>
              <th>Signal</th>
              <th>Status</th>
              <th>Value</th>
              <th>Error / Notes</th>
            </tr>
          </thead>
          <tbody id="signals-body">
            <!-- Populated dynamically -->
          </tbody>
        </table>
      </section>

      <canvas
        id="fingerprint-canvas"
        width="240"
        height="60"
        style="display: none"
      ></canvas>
    </div>

    <!-- The type="module" allows us to split app.js into smaller files -->
    <script type="module" src="app.js"></script>
  </body>
</html>
